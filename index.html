<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CivilAegis - Personal Warning System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        light: '#ffffff',
                        lighter: '#f8fafc',
                        primary: '#3b82f6',
                        danger: '#ef4444',
                        warning: '#eab308',
                        fire: '#f97316',
                        nature: '#0ea5e9',
                        textMain: '#0f172a',
                        textMuted: '#64748b'
                    }
                }
            }
        }
    </script>

    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- jsPDF for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* lighter */
            color: #0f172a; /* textMain */
            overflow: hidden; /* Prevent body scroll, handle per-view */
        }
        
        #map {
            height: calc(100vh - 60px - 64px); /* Viewport - Header - Bottom Nav */
            width: 100%;
            z-index: 10;
        }

        /* Custom marker styles */
        .custom-marker {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            border: 2px solid white;
        }
        .marker-earthquake { background-color: #0ea5e9; }
        .marker-police { background-color: #3b82f6; }
        .marker-hospital { background-color: #ef4444; }
        .marker-fire_station { background-color: #f97316; }
        .marker-news { background-color: #eab308; }
        .marker-user { 
            background-color: #3b82f6; 
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3);
        }

        /* Bottom Sheet Animation */
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }
        .bottom-sheet.open {
            transform: translateY(0);
        }

        /* View transitions */
        .view-section {
            display: none;
            height: calc(100vh - 60px - 64px);
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .view-section.active {
            display: block;
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="antialiased flex flex-col h-screen">

    <!-- Top Header -->
    <header class="h-[60px] bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0 z-20 shadow-sm">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-shield-halved text-primary text-xl"></i>
            <h1 class="text-lg font-bold tracking-wider text-slate-800">CIVIL<span class="text-primary">AEGIS</span></h1>
        </div>
        <div class="flex items-center gap-3 text-sm">
            <div id="gps-status" class="flex items-center gap-1 text-warning">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-warning opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-warning"></span>
                </span>
                <span id="gps-text" class="font-medium text-slate-600">Acquiring Signal...</span>
            </div>
            <button class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center border border-slate-200 shadow-sm hover:bg-slate-200 transition">
                <i class="fa-solid fa-user text-slate-500 text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative bg-slate-50">
        
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-slate-50 z-[100] flex flex-col items-center justify-center">
            <i class="fa-solid fa-satellite-dish text-4xl text-primary animate-pulse mb-4"></i>
            <h2 class="text-xl font-bold mb-2 text-slate-800">Securing Coordinates</h2>
            <p id="loading-text" class="text-slate-500 text-sm text-center px-6">Connecting to GPS satellites...</p>
        </div>

        <!-- VIEW 1: RADAR (MAP) -->
        <div id="view-radar" class="view-section active !p-0 !overflow-hidden">
            <div id="map"></div>
            
            <!-- Map Overlay Controls -->
            <div class="absolute top-4 right-4 z-[40] flex flex-col gap-2">
                <button onclick="centerMapOnUser()" class="w-10 h-10 bg-white border border-slate-200 rounded-lg shadow-md flex items-center justify-center text-slate-700 hover:bg-slate-50 active:bg-slate-100 transition">
                    <i class="fa-solid fa-crosshairs"></i>
                </button>
            </div>

            <!-- Bottom Sheet (Incident Details) -->
            <div id="incident-sheet" class="bottom-sheet absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] p-5">
                <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-5"></div>
                
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-3">
                        <div id="sheet-icon" class="w-10 h-10 rounded-full flex items-center justify-center text-white text-base shadow-sm">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                        <div>
                            <h3 id="sheet-title" class="font-bold text-lg leading-tight text-slate-900">Incident Details</h3>
                            <p id="sheet-distance" class="text-xs font-medium text-slate-500 mt-0.5">1.2 km from your location</p>
                        </div>
                    </div>
                    <button onclick="closeSheet()" class="text-slate-400 p-1 hover:text-slate-600 bg-slate-100 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-times"></i></button>
                </div>

                <div class="bg-slate-50 rounded-xl p-4 mb-4 border border-slate-100">
                    <p id="sheet-desc" class="text-sm text-slate-700 mb-3 leading-relaxed break-words">Incident description will appear here.</p>
                    <div class="flex items-center justify-between text-xs font-medium text-slate-500 border-t border-slate-200 pt-3 mt-1">
                        <span id="sheet-time"><i class="fa-regular fa-clock mr-1"></i> 15 mins ago</span>
                        <span id="sheet-source"><i class="fa-solid fa-database mr-1"></i> Live Data API</span>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button id="btn-save" onclick="toggleSaveIncident()" class="flex-1 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 rounded-xl py-3 font-semibold text-sm flex items-center justify-center gap-2 transition-colors shadow-sm">
                        <i class="fa-regular fa-bookmark"></i> Save
                    </button>
                    <button onclick="routeToIncident()" class="flex-1 bg-primary hover:bg-blue-600 text-white rounded-xl py-3 font-semibold text-sm flex items-center justify-center gap-2 transition-colors shadow-sm shadow-blue-200">
                        <i class="fa-solid fa-route"></i> Actions
                    </button>
                </div>
            </div>
        </div>

        <!-- VIEW 2: FEED (LIST) -->
        <div id="view-feed" class="view-section p-4 bg-slate-50">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-800">
                <i class="fa-solid fa-list-ul text-primary"></i> Live Intel Feed
            </h2>
            
            <div class="flex gap-2 overflow-x-auto pb-4 mb-2 no-scrollbar">
                <button onclick="filterFeed('all')" class="filter-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-primary text-white whitespace-nowrap shadow-sm shadow-blue-200">All</button>
                <button onclick="filterFeed('earthquake')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap hover:bg-slate-50">Earthquakes</button>
                <button onclick="filterFeed('safezone')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap hover:bg-slate-50">Safe Zones</button>
                <button onclick="filterFeed('news')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap hover:bg-slate-50">Intel Feed</button>
            </div>

            <div id="feed-container" class="flex flex-col gap-3">
                <!-- Feed items will be injected here -->
            </div>
        </div>

        <!-- VIEW 3: SAVED (BOOKMARKS) -->
        <div id="view-saved" class="view-section p-4 bg-slate-50">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2 text-slate-800">
                    <i class="fa-solid fa-bookmark text-primary"></i> Saved Reports
                </h2>
                <button onclick="exportToPDF()" class="bg-blue-50 text-primary border border-blue-200 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 hover:bg-blue-100 transition shadow-sm">
                    <i class="fa-solid fa-file-pdf"></i> Export PDF
                </button>
            </div>

            <div id="saved-container" class="flex flex-col gap-3">
                <!-- Saved items will be injected here -->
                <div class="text-center text-slate-400 mt-12">
                    <i class="fa-solid fa-box-open text-5xl mb-4 text-slate-300"></i>
                    <p class="font-medium">No saved reports yet.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="h-[64px] bg-white border-t border-slate-200 shrink-0 z-20 flex justify-around items-center px-2 pb-safe shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
        <button onclick="switchTab('radar')" id="tab-radar" class="nav-btn active flex flex-col items-center justify-center w-16 h-full text-primary">
            <i class="fa-solid fa-crosshairs text-xl mb-1"></i>
            <span class="text-[10px] font-semibold">Radar</span>
        </button>
        <button onclick="switchTab('feed')" id="tab-feed" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-slate-400 hover:text-slate-600 transition-colors">
            <i class="fa-solid fa-list-ul text-xl mb-1"></i>
            <span class="text-[10px] font-semibold">Feed</span>
        </button>
        <button onclick="switchTab('saved')" id="tab-saved" class="nav-btn flex flex-col items-center justify-center w-16 h-full text-slate-400 hover:text-slate-600 transition-colors">
            <div class="relative">
                <i class="fa-solid fa-bookmark text-xl mb-1"></i>
                <span id="saved-badge" class="absolute -top-1 -right-2 bg-danger text-white text-[8px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden shadow-sm">0</span>
            </div>
            <span class="text-[10px] font-semibold">Saved</span>
        </button>
    </nav>

    <script>
        // --- STATE MANAGEMENT ---
        let map = null;
        let userMarker = null;
        let userLocation = { lat: -6.200000, lng: 106.816666 }; // Default Jakarta
        let incidents = []; // Realtime data array
        let savedIncidents = JSON.parse(localStorage.getItem('civilAegisSaved')) || [];
        let markersLayer = null;
        let currentSelectedIncident = null;

        // Incident Categories Config (Updated for Real API Data)
        const INCIDENT_TYPES = {
            earthquake: { color: 'marker-earthquake', hex: '#0ea5e9', icon: 'fa-house-crack', name: 'Earthquake', source: 'USGS API' },
            police: { color: 'marker-police', hex: '#3b82f6', icon: 'fa-building-shield', name: 'Police Station', source: 'OSM Overpass' },
            hospital: { color: 'marker-hospital', hex: '#ef4444', icon: 'fa-truck-medical', name: 'Hospital', source: 'OSM Overpass' },
            fire_station: { color: 'marker-fire_station', hex: '#f97316', icon: 'fa-fire-extinguisher', name: 'Fire Dept', source: 'OSM Overpass' },
            news: { color: 'marker-news', hex: '#eab308', icon: 'fa-newspaper', name: 'Intel Report', source: 'GDELT Project' }
        };

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            updateSavedBadge();
        });

        function initApp() {
            // Check geolocation
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        setupMapAndData();
                    },
                    (error) => {
                        console.warn("GPS Denied/Failed, using default location (Jakarta).", error);
                        setupMapAndData();
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                setupMapAndData();
            }
        }

        async function setupMapAndData() {
            // Update Loading Screen text
            document.getElementById('loading-text').innerText = "Fetching real-time intelligence from USGS, OpenStreetMap, and GDELT...";
            
            // Wait for real data fetch
            await fetchRealData(userLocation.lat, userLocation.lng);

            // Update UI status
            document.getElementById('gps-status').innerHTML = `
                <span class="relative flex h-2.5 w-2.5">
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span>
                <span class="text-green-600 font-semibold text-xs">Live Data Connected</span>
            `;
            
            // Init Leaflet
            initMap();

            // Populate Feeds
            renderFeed('all');
            renderSaved();

            // Hide Loading
            setTimeout(() => {
                document.getElementById('loading-overlay').classList.add('hidden');
                map.invalidateSize(); // Ensure map renders correctly after loading screen disappears
            }, 500);
        }

        // --- REAL API DATA FETCHING ---
        async function fetchRealData(lat, lng) {
            incidents = [];
            
            // 1. Fetch Earthquakes (USGS API - M2.5+ Global Past Day)
            const fetchUSGS = fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson')
                .then(res => res.json())
                .then(data => {
                    data.features.forEach(feature => {
                        const eqLat = feature.geometry.coordinates[1];
                        const eqLng = feature.geometry.coordinates[0];
                        const dist = calculateDistance(lat, lng, eqLat, eqLng);
                        
                        if (dist <= 2000) { // Keep within 2000km radius for relevance
                            incidents.push({
                                id: 'usgs_' + feature.id,
                                type: 'earthquake',
                                title: `Mag ${feature.properties.mag} Earthquake`,
                                desc: feature.properties.place,
                                lat: eqLat,
                                lng: eqLng,
                                timeText: new Date(feature.properties.time).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'}),
                                timestamp: new Date(feature.properties.time).toISOString(),
                                dist: dist
                            });
                        }
                    });
                })
                .catch(e => console.error('USGS Fetch Error:', e));

            // 2. Fetch Safe Zones / Infrastructure (Overpass API - 10km Radius)
            const overpassQuery = `
                [out:json][timeout:15];
                (
                  node["amenity"="police"](around:10000,${lat},${lng});
                  node["amenity"="hospital"](around:10000,${lat},${lng});
                  node["amenity"="fire_station"](around:10000,${lat},${lng});
                );
                out body;
            `;
            const overpassUrl = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(overpassQuery.trim());
            const fetchOverpass = fetch(overpassUrl)
                .then(res => {
                    if (!res.ok) throw new Error('API Overpass rate-limited or error');
                    return res.json();
                })
                .then(data => {
                    if (data && data.elements) {
                        data.elements.forEach(el => {
                            let type = 'safezone';
                            let title = 'Emergency Facility';
                            let desc = 'Nearest safe location/assistance.';
                            
                            if(el.tags.amenity === 'police') { title = el.tags.name || 'Police Station'; type = 'police'; desc = 'Law Enforcement & Security Facility'; }
                            if(el.tags.amenity === 'hospital') { title = el.tags.name || 'Hospital'; type = 'hospital'; desc = 'Medical & Trauma Facility'; }
                            if(el.tags.amenity === 'fire_station') { title = el.tags.name || 'Fire Dept'; type = 'fire_station'; desc = 'Fire & Rescue Department'; }

                            const dist = calculateDistance(lat, lng, el.lat, el.lon);
                            incidents.push({
                                id: 'osm_' + el.id,
                                type: type,
                                title: title,
                                desc: desc,
                                lat: el.lat,
                                lng: el.lon,
                                timeText: 'Static Location',
                                timestamp: new Date().toISOString(),
                                dist: dist
                            });
                        });
                    }
                })
                .catch(e => console.warn('Overpass Fetch Warning:', e.message));

            // 3. Fetch GDELT Project (Using Cloudflare Worker to bypass CORS)
            // ---> GANTI URL DI BAWAH INI DENGAN URL WORKER CLOUDFLARE MILIKMU <---
            // Contoh URL: 'https://gdelt-proxy.usernamekamu.workers.dev/?query=tone<-2&format=geojson'
            // Sementara menggunakan public CORS proxy agar preview tidak error saat kamu membangun Worker
            const workerUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.gdeltproject.org/api/v2/geo/geo?query=tone<-2&format=geojson');
            
            const fetchGDELT = fetch(workerUrl)
                .then(res => res.json())
                .then(data => {
                    if(data.features) {
                        data.features.forEach((feature, index) => {
                            const gLat = feature.geometry.coordinates[1];
                            const gLng = feature.geometry.coordinates[0];
                            const dist = calculateDistance(lat, lng, gLat, gLng);
                            
                            if(dist <= 500) { // Keep within 500km radius
                                incidents.push({
                                    id: 'gdelt_' + index,
                                    type: 'news',
                                    title: feature.properties.name || 'Intel Report (GDELT)',
                                    desc: `Recent event detected. Source URL: ${feature.properties.url || 'GDELT Global Database'}`,
                                    lat: gLat,
                                    lng: gLng,
                                    timeText: 'Recent',
                                    timestamp: new Date().toISOString(),
                                    dist: dist
                                });
                            }
                        });
                    }
                })
                .catch(e => console.warn('GDELT Fetch Error (Normal if rate limited):', e));

            // Execute all API requests concurrently
            await Promise.allSettled([fetchUSGS, fetchOverpass, fetchGDELT]);

            // Sort all collected data by distance to user
            incidents.sort((a, b) => a.dist - b.dist);
        }

        // --- MAP FUNCTIONS ---
        function initMap() {
            // Create map instance
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([userLocation.lat, userLocation.lng], 14);

            // Add OpenStreetMap tiles (Free) - Light Theme Default
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd'
            }).addTo(map);

            // Layer for markers
            markersLayer = L.layerGroup().addTo(map);

            // Add User Marker
            const userIconHtml = `<div class="custom-marker marker-user w-6 h-6"><i class="fa-solid fa-person"></i></div>`;
            const userIcon = L.divIcon({ className: 'bg-transparent', html: userIconHtml, iconSize: [24, 24], iconAnchor: [12, 12] });
            userMarker = L.marker([userLocation.lat, userLocation.lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);

            // Add Incident Markers
            renderMapMarkers();
        }

        function renderMapMarkers() {
            markersLayer.clearLayers();
            
            incidents.forEach(inc => {
                const typeInfo = INCIDENT_TYPES[inc.type];
                if(!typeInfo) return; // fail-safe

                const iconHtml = `<div class="custom-marker ${typeInfo.color} w-8 h-8"><i class="fa-solid ${typeInfo.icon}"></i></div>`;
                const icon = L.divIcon({ className: 'bg-transparent', html: iconHtml, iconSize: [32, 32], iconAnchor: [16, 16] });
                
                const marker = L.marker([inc.lat, inc.lng], { icon: icon })
                    .addTo(markersLayer)
                    .on('click', () => openIncidentSheet(inc));
            });
        }

        function centerMapOnUser() {
            map.setView([userLocation.lat, userLocation.lng], 14, { animate: true });
        }

        // --- UI INTERACTIONS ---
        function switchTab(tabId) {
            // Update Buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-primary');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.classList.remove('text-slate-400');
            activeBtn.classList.add('text-primary');

            // Update Views
            document.querySelectorAll('.view-section').forEach(view => {
                view.classList.remove('active');
            });
            document.getElementById('view-' + tabId).classList.add('active');

            // Specific View Logic
            if(tabId === 'radar') {
                setTimeout(() => map.invalidateSize(), 100);
            } else if (tabId === 'saved') {
                renderSaved();
            }
            
            closeSheet();
        }

        // --- BOTTOM SHEET LOGIC ---
        function openIncidentSheet(inc) {
            currentSelectedIncident = inc;
            const typeInfo = INCIDENT_TYPES[inc.type];
            const dist = calculateDistance(userLocation.lat, userLocation.lng, inc.lat, inc.lng).toFixed(1);

            document.getElementById('sheet-title').innerText = inc.title;
            document.getElementById('sheet-distance').innerText = `${dist} km from your location`;
            document.getElementById('sheet-desc').innerText = inc.desc;
            document.getElementById('sheet-time').innerHTML = `<i class="fa-regular fa-clock mr-1"></i> ${inc.timeText}`;
            document.getElementById('sheet-source').innerHTML = `<i class="fa-solid fa-database mr-1"></i> ${typeInfo.source}`;
            
            const iconDiv = document.getElementById('sheet-icon');
            iconDiv.className = `w-10 h-10 rounded-full flex items-center justify-center text-white text-lg shadow-md ${typeInfo.color}`;
            iconDiv.innerHTML = `<i class="fa-solid ${typeInfo.icon}"></i>`;

            updateSaveButtonUI();

            document.getElementById('incident-sheet').classList.add('open');
            
            // Pan map
            map.flyTo([inc.lat, inc.lng], 15, { duration: 0.5 });
        }

        function closeSheet() {
            document.getElementById('incident-sheet').classList.remove('open');
            currentSelectedIncident = null;
        }

        function routeToIncident() {
            alert("External routing feature mapping to safe zones. (In development)");
        }

        // --- FEED & SAVED VIEWS ---
        function filterFeed(type) {
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white', 'shadow-sm', 'shadow-blue-200');
                btn.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
            });
            event.target.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
            event.target.classList.add('bg-primary', 'text-white', 'shadow-sm', 'shadow-blue-200');

            renderFeed(type);
        }

        function renderFeed(filterType) {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            const filtered = filterType === 'all' 
                ? incidents 
                : filterType === 'safezone' 
                    ? incidents.filter(i => ['police', 'hospital', 'fire_station'].includes(i.type))
                    : incidents.filter(i => i.type === filterType);

            if(filtered.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center text-sm py-8 font-medium">No live intelligence data for this category in your radius.</p>`;
                return;
            }

            filtered.forEach(inc => {
                container.appendChild(createIncidentCard(inc));
            });
        }

        function renderSaved() {
            const container = document.getElementById('saved-container');
            container.innerHTML = '';

            if(savedIncidents.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-slate-400 mt-12">
                        <i class="fa-solid fa-box-open text-5xl mb-4 text-slate-300"></i>
                        <p class="font-medium">No saved reports yet.</p>
                    </div>`;
                return;
            }

            savedIncidents.forEach(inc => {
                container.appendChild(createIncidentCard(inc, true));
            });
        }

        function createIncidentCard(inc, isSavedView = false) {
            const typeInfo = INCIDENT_TYPES[inc.type];
            if(!typeInfo) return document.createElement('div');
            
            const dist = calculateDistance(userLocation.lat, userLocation.lng, inc.lat, inc.lng).toFixed(1);
            
            const div = document.createElement('div');
            div.className = "bg-white border border-slate-200 rounded-2xl p-4 flex gap-4 active:bg-slate-50 transition-colors shadow-sm cursor-pointer hover:shadow-md";
            div.onclick = () => {
                switchTab('radar');
                openIncidentSheet(inc);
            };

            div.innerHTML = `
                <div class="${typeInfo.color} w-10 h-10 rounded-full flex items-center justify-center text-white shrink-0 shadow-md">
                    <i class="fa-solid ${typeInfo.icon}"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-sm leading-tight text-slate-800 truncate pr-2">${inc.title}</h3>
                        ${isSavedView ? `<button onclick="event.stopPropagation(); removeSaved('${inc.id}')" class="text-slate-400 hover:text-danger bg-slate-50 rounded-full p-1.5 w-7 h-7 flex items-center justify-center shrink-0"><i class="fa-solid fa-trash text-xs"></i></button>` : `<span class="text-[10px] font-medium bg-slate-100 px-2 py-0.5 rounded text-slate-500 whitespace-nowrap shrink-0">${inc.timeText}</span>`}
                    </div>
                    <p class="text-xs text-slate-500 mt-1.5 line-clamp-2 leading-relaxed break-words">${inc.desc}</p>
                    <div class="flex items-center gap-3 mt-3 text-[10px] font-medium text-slate-400 truncate">
                        <span class="flex items-center gap-1 shrink-0"><i class="fa-solid fa-location-arrow"></i> ${dist} km</span>
                        <span class="flex items-center gap-1 truncate"><i class="fa-solid fa-satellite"></i> ${typeInfo.source}</span>
                    </div>
                </div>
            `;
            return div;
        }

        // --- LOCAL STORAGE LOGIC ---
        function toggleSaveIncident() {
            if(!currentSelectedIncident) return;
            
            const index = savedIncidents.findIndex(i => i.id === currentSelectedIncident.id);
            if(index > -1) {
                // Remove
                savedIncidents.splice(index, 1);
            } else {
                // Add
                savedIncidents.push(currentSelectedIncident);
            }
            
            localStorage.setItem('civilAegisSaved', JSON.stringify(savedIncidents));
            updateSaveButtonUI();
            updateSavedBadge();
            
            // Notification toast
            const toast = document.createElement('div');
            toast.className = "fixed top-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-2.5 rounded-full text-sm font-semibold z-[1000] shadow-lg transition-opacity flex items-center gap-2";
            toast.innerHTML = index > -1 ? '<i class="fa-solid fa-trash-can"></i> Removed from archive' : '<i class="fa-solid fa-check-circle text-green-400"></i> Saved to device';
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(()=>toast.remove(), 300); }, 2000);
        }

        function removeSaved(id) {
            savedIncidents = savedIncidents.filter(i => i.id !== id);
            localStorage.setItem('civilAegisSaved', JSON.stringify(savedIncidents));
            updateSavedBadge();
            renderSaved();
        }

        function updateSaveButtonUI() {
            if(!currentSelectedIncident) return;
            const btn = document.getElementById('btn-save');
            const isSaved = savedIncidents.some(i => i.id === currentSelectedIncident.id);
            
            if(isSaved) {
                btn.innerHTML = `<i class="fa-solid fa-bookmark"></i> Saved`;
                btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-300');
                btn.classList.add('bg-blue-50', 'text-primary', 'border-blue-200');
            } else {
                btn.innerHTML = `<i class="fa-regular fa-bookmark"></i> Save`;
                btn.classList.add('bg-white', 'text-slate-700', 'border-slate-300');
                btn.classList.remove('bg-blue-50', 'text-primary', 'border-blue-200');
            }
        }

        function updateSavedBadge() {
            const badge = document.getElementById('saved-badge');
            if(savedIncidents.length > 0) {
                badge.innerText = savedIncidents.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- PDF EXPORT (SitRep) ---
        function exportToPDF() {
            if(savedIncidents.length === 0) {
                alert("Please save at least one incident to export a PDF.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Header (Light Theme adjustment)
            doc.setFillColor(255, 255, 255); 
            doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(15, 23, 42); // slate-900
            doc.setFontSize(20);
            doc.setFont("helvetica", "bold");
            doc.text("CIVILAEGIS", 14, 20);
            
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(100, 116, 139); // slate-500
            doc.text("SITUATION REPORT (SITREP)", 140, 20);
            
            // Separator line
            doc.setDrawColor(226, 232, 240); // slate-200
            doc.line(14, 25, 196, 25);

            // Meta info
            doc.setTextColor(15, 23, 42); // slate-900
            doc.setFontSize(10);
            const dateStr = new Date().toLocaleString('en-US');
            doc.text(`Generated On : ${dateStr}`, 14, 38);
            doc.text(`Monitor Coordinates : ${userLocation.lat.toFixed(5)}, ${userLocation.lng.toFixed(5)}`, 14, 44);
            doc.text(`Total Incidents : ${savedIncidents.length} Reports`, 14, 50);

            // Table Data
            const tableColumn = ["Time", "Category", "Incident Description", "Coordinates"];
            const tableRows = [];

            savedIncidents.forEach(inc => {
                const date = new Date(inc.timestamp).toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
                const typeName = INCIDENT_TYPES[inc.type].name;
                const coord = `${inc.lat.toFixed(4)}, ${inc.lng.toFixed(4)}`;
                const descData = `${inc.title}\n${inc.desc}`;
                tableRows.push([date, typeName, descData, coord]);
            });

            doc.autoTable({
                startY: 58,
                head: [tableColumn],
                body: tableRows,
                theme: 'grid',
                headStyles: { fillColor: [59, 130, 246], textColor: 255 }, // primary blue
                columnStyles: {
                    0: { cellWidth: 20 },
                    1: { cellWidth: 25 },
                    2: { cellWidth: 95 },
                    3: { cellWidth: 40 }
                },
                styles: { fontSize: 9, cellPadding: 4, textColor: [51, 65, 85] } // slate-700
            });

            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            for(let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(148, 163, 184); // slate-400
                doc.text(`Automatically generated by CivilAegis Open Intelligence System - Page ${i}`, 14, doc.internal.pageSize.height - 10);
            }

            // Save
            doc.save(`CivilAegis_SitRep_${Date.now()}.pdf`);
        }

        // --- UTILS ---
        // Calculate distance in KM using Haversine formula
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the earth in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c; 
        }

    </script>
