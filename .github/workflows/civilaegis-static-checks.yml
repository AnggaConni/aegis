name: CivilAegis Static Checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "tests/frontend-script-syntax.test.mjs"
      - ".github/workflows/civilaegis-static-checks.yml"
  pull_request:
    paths:
      - "index.html"
      - "sw.js"
      - "tests/frontend-script-syntax.test.mjs"
      - ".github/workflows/civilaegis-static-checks.yml"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Run frontend regression tests
        run: node --test tests/frontend-script-syntax.test.mjs
